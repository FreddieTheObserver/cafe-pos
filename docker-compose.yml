services:
  postgres:
    image: postgres:16
    container_name: cafepos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafepos
      POSTGRES_PASSWORD: cafepos_dev_pw
      POSTGRES_DB: cafepos
    ports:
      - "5432:5432"
    volumes:
      - cafepos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafepos -d cafepos"]
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: cafepos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  cafepos_pgdata: