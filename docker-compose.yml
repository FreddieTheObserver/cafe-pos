services:
  postgres:
    image: postgres:16
    container_name: cafepos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafepos
      POSTGRES_PASSWORD: cafepos_dev_pw
      POSTGRES_DB: cafepos
    ports:
      # Host 5433 -> container 5432: avoids clashing with a native PostgreSQL
      # install that already occupies host 5432.
      - "5433:5432"
    volumes:
      - cafepos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafepos -d cafepos"]
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: cafepos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  # Stands in for S3 (§12.4). The API talks to it through the same
  # S3-compatible client it uses in production, so the adapter code is
  # identical and only the endpoint and credentials change per environment.
  minio:
    # Pinned like postgres and redis above. `latest` would let a MinIO release
    # change local dev and CI with no commit to point at when something breaks.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: cafepos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cafepos
      MINIO_ROOT_PASSWORD: cafepos_dev_secret
    ports:
      # 9000 is the S3 API; 9001 is the web console, handy for eyeballing what
      # the upload pipeline actually wrote.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cafepos_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  cafepos_pgdata:
  cafepos_miniodata: