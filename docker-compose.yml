services:
  postgres:
    image: postgres:16
    container_name: cafepos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafepos
      POSTGRES_PASSWORD: cafepos_dev_pw
      POSTGRES_DB: cafepos
    ports:
      # Host 5433 -> container 5432: avoids clashing with a native PostgreSQL
      # install that already occupies host 5432.
      - "5433:5432"
    volumes:
      - cafepos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafepos -d cafepos"]
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: cafepos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  # Stands in for S3 (§12.4). The API talks to it through the same
  # S3-compatible client it uses in production, so the adapter code is
  # identical and only the endpoint and credentials change per environment.
  seaweedfs:
    # Pinned like postgres and redis above. `latest` would let a release change
    # local dev and CI with no commit to point at when something breaks. Not
    # MinIO: its community edition is archived and no registry serves its
    # images any more.
    image: chrislusf/seaweedfs:4.51
    container_name: cafepos-seaweedfs
    restart: unless-stopped
    # `mini` runs the whole store in one process. Without an admin password the
    # admin UI binds to the container's loopback and the host cannot reach it.
    command: >-
      mini -dir=/data -master.telemetry=false
      -admin.user=cafepos -admin.password=cafepos_dev_secret
    environment:
      # The S3 identity the app signs requests with.
      AWS_ACCESS_KEY_ID: cafepos
      AWS_SECRET_ACCESS_KEY: cafepos_dev_secret
    ports:
      # 8333 is the S3 API, published on 9000 so every S3_* URL stays as it
      # was. 12535 is the admin UI, handy for eyeballing what the upload
      # pipeline actually wrote.
      - "9000:8333"
      - "12535:12535"
    volumes:
      - cafepos_seaweedfsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
  # Stripe's protocol-accurate fake, pinned like everything else here so CI and
  # local dev cannot drift. Not wired up by default: local development talks to
  # real Stripe in test mode, because that is the only place PromptPay, dynamic
  # payment methods and the Dashboard behave like they will in production.
  # Point at it deliberately when you want the gateway path offline:
  #   STRIPE_API_BASE=http://localhost:12111 pnpm test:e2e
  stripe-mock:
    image: stripe/stripe-mock:v0.206.0
    container_name: cafepos-stripe-mock
    restart: unless-stopped
    ports:
      - '12111:12111'

  # Watches the API running on the host (METRICS_PORT 9464) and evaluates
  # ops/prometheus/alerts.yml against it, so a rule can be watched firing
  # before it is trusted to page anyone. Behind a profile, so a plain
  # `docker compose up -d` still starts only what the tests need:
  #   docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: cafepos-prometheus
    restart: unless-stopped
    profiles: [observability]
    ports:
      - '9090:9090'
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - cafepos_prometheusdata:/prometheus
    # Docker Desktop resolves host.docker.internal by itself; this makes a Linux engine do the same.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
  grafana:
    image: grafana/grafana:13.3.0
    container_name: cafepos-grafana
    restart: unless-stopped
    profiles: [observability]
    depends_on: [prometheus]
    ports:
      # 3000 is the API.
      - '3001:3000'
    environment:
      # Local only: no login screen between a developer and the dashboard.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
  # Receives traces from the app on the host (OTLP over HTTP on 4318) and
  # shows them on http://localhost:16686. Start the app with
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: cafepos-jaeger
    restart: unless-stopped
    profiles: [observability]
    ports:
      - '4318:4318'
      - '16686:16686'

volumes:
  cafepos_pgdata:
  cafepos_seaweedfsdata:
  cafepos_prometheusdata: