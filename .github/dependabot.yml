# Section 16: Dependabot on. Weekly, grouped, so updates arrive as a few PRs
# rather than one per package; security updates are raised as they publish.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
        # A new SDK means a new pinned apiVersion (payments.module.ts), an edit
        # no bot can make. In the group it would fail the typecheck and hold
        # back every other production update; alone it waits only on itself.
        exclude-patterns: [stripe]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
