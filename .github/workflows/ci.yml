name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Spin up the same stack docker-compose runs locally, so migrations (and
    # future integration tests) have a real Postgres + Redis to hit.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cafepos
          POSTGRES_PASSWORD: cafepos_dev_pw
          POSTGRES_DB: cafepos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cafepos -d cafepos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      NODE_ENV: test
      # Runners have no native Postgres, so host 5432 is free here (unlike local).
      DATABASE_URL: postgresql://cafepos:cafepos_dev_pw@localhost:5432/cafepos
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint "{src,test}/**/*.ts"

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Test
        run: pnpm test
