name: CI

on:
  # Scoped to main so PR branches run once (via pull_request) instead of twice.
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Spin up the same stack docker-compose runs locally, so migrations (and
    # future integration tests) have a real Postgres + Redis to hit.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cafepos
          POSTGRES_PASSWORD: cafepos_dev_pw
          POSTGRES_DB: cafepos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cafepos -d cafepos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      # Stripe's own protocol-accurate fake. It authenticates nothing and
      # returns fixtures, so the payment suites exercise the real SDK and the
      # real adapter without a key and without the network — which is the only
      # way `pnpm test:e2e` can cover the gateway path at all. No healthcheck:
      # the image ships no curl or shell tools, so the wait is a step below.
      stripe-mock:
        image: stripe/stripe-mock:v0.196.0
        ports:
          - 12111:12111

    env:
      NODE_ENV: test
      # Runners have no native Postgres, so host 5432 is free here (unlike local).
      DATABASE_URL: postgresql://cafepos:cafepos_dev_pw@localhost:5432/cafepos
      REDIS_URL: redis://localhost:6379
      # Test-only signing key. Not a secret worth protecting — it signs nothing
      # outside this job — but it has to clear the 32-char floor the app enforces.
      JWT_SECRET: ci-only-jwt-signing-key-not-used-anywhere-else
      # Object storage (§12.4), same MinIO the compose stack runs locally.
      S3_BUCKET: cafepos-media
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: cafepos
      S3_SECRET_ACCESS_KEY: cafepos_dev_secret
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_BASE_URL: http://localhost:9000/cafepos-media
      # The bucket is a job-scoped container here, so let the app create it
      # rather than adding an mc step just to mkdir.
      S3_AUTO_CREATE_BUCKET: 'true'
      # Payment gateway (§10.5). Deliberately NOT repository secrets: these are
      # syntactically valid and functionally dead, so every suite that boots the
      # app gets a config it can parse, and any test that reaches the network
      # fails loudly here instead of quietly charging a real sandbox. Tests that
      # need gateway behaviour stub the PaymentProvider port or talk to
      # stripe-mock; none of them authenticate.
      STRIPE_SECRET_KEY: rk_test_ciplaceholdernotarealkey
      STRIPE_WEBHOOK_SECRETS: whsec_ciplaceholdernotarealsecret
      # Retargets the SDK at the fake above. The key stays dead on purpose:
      # stripe-mock ignores it, so a suite that somehow escaped to the real API
      # would still fail loudly rather than quietly charging a sandbox.
      STRIPE_API_BASE: http://localhost:12111

    steps:
      - uses: actions/checkout@v4

      # Not a `services:` entry: minio/minio needs `server /data` as its
      # command, and service containers cannot override one. The tag is pinned
      # to the same release as docker-compose, so CI and local dev cannot drift.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=cafepos \
            -e MINIO_ROOT_PASSWORD=cafepos_dev_secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          echo "MinIO did not become healthy" >&2
          docker logs minio >&2
          exit 1

      # The service container has no healthcheck (no shell in the image), so
      # readiness is proven from the runner instead. Any HTTP answer means the
      # listener is up; 401 is a perfectly good one.
      - name: Wait for stripe-mock
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:12111/v1/payment_intents; then
              exit 0
            fi
            sleep 1
          done
          echo "stripe-mock did not become reachable" >&2
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint "{src,test}/**/*.ts"

      # `pnpm build` compiles with tsconfig.build.json, which excludes specs —
      # so without this step a type error in a test file reaches main unnoticed.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      # Runs against the migrated Postgres above: proves the schema's money
      # constraints are actually armed, not just declared (§7.4).
      - name: Integration tests
        run: pnpm test:e2e
