# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

# Hard limit: 250 characters. Anything longer fails validation and CodeRabbit
# silently falls back to its defaults, so the rest of this file is ignored too.
tone_instructions: >-
  Be direct and technical. Verify claims against the code before asserting
  them; if you cannot verify something, say so. DESIGN.md is the spec — where
  code and DESIGN.md disagree, that disagreement is the finding.

reviews:
  profile: assertive
  high_level_summary: true
  review_status: true
  poem: false
  # Off deliberately. On the free tier a PR-per-phase cadence burns the review
  # allowance on whichever PR happens to be open first — on PR #3 it produced a
  # "review limit reached" comment and no review at all, which is worse than
  # not being invited, because the PR looks reviewed when nothing read it.
  #
  # Everything below still applies when CodeRabbit is asked directly with
  # `@coderabbitai review`, so this disables the automatic trigger, not the
  # tool. Set back to true if the account moves off the free tier.
  auto_review:
    enabled: false
    drafts: false

  path_filters:
    # Generated by drizzle-kit and meaningless to review line by line. The .sql
    # migrations are NOT excluded — those are worth reading closely.
    - '!drizzle/meta/**'
    - '!pnpm-lock.yaml'

  path_instructions:
    - path: 'src/**/*.ts'
      instructions: >-
        Comments explain why, not what, and cite the relevant DESIGN.md section
        (e.g. §7.4). Flag comments that restate the code, and comments that
        claim behaviour the code does not implement — a comment describing an
        exclusion or guarantee that does not exist is a real defect here, not a
        nitpick.

        Money is always integer minor units plus a currency code; a float or a
        major-unit amount anywhere in the money path is a bug.

    - path: 'src/database/schema/**/*.ts'
      instructions: >-
        This schema mirrors DESIGN.md §7.2 one-to-one and §7.3 drives every
        index. Flag indexes that duplicate a unique constraint's backing btree,
        and columns whose CHECK constraint does not match the TypeScript enum
        tuple — the tuples in enums.ts intentionally drive both the compile-time
        narrowing and the database CHECK so the two cannot diverge.

        Schema changes require a generated drizzle-kit migration in the same
        change. Migration 0000 must never be regenerated: it contains a
        hand-added CREATE EXTENSION citext that the generator does not
        reproduce.

    - path: 'src/common/errors/**/*.ts'
      instructions: >-
        Every non-2xx response uses the RFC 9457 envelope from DESIGN.md §9.1.
        `code` is a stable machine string clients switch on; `detail` is human
        text that must never carry stack traces, driver messages, connection
        strings, or any other internal information. Flag any path where an
        exception's message can reach `detail` on a 5xx.

    - path: 'test/**/*.e2e-spec.ts'
      instructions: >-
        These run against real Postgres and Redis, not mocks.

        The constraint suite asserts SQLSTATE and constraint name deliberately,
        so a write rejected by the wrong constraint fails the test rather than
        passing quietly. Note that Postgres evaluates CHECK constraints on the
        tuple during the insert while foreign keys are AFTER ROW triggers, so a
        CHECK is reached before an FK — verify against that ordering before
        claiming a test cannot reach the constraint it names.

    - path: '**/*.spec.ts'
      instructions: >-
        Judge whether a fixture matches what the real dependency actually
        produces. Three defects on this project came from invented fixtures:
        errors built as `new Error('some message')` hid that ioredis and pg both
        raise an AggregateError whose own message is empty. Flag fixtures that
        model a happy-path shape of an error or driver response where the real
        one differs.

        A `@ts-expect-error` on an argument of an overloaded call suppresses
        nothing, because TypeScript reports the error at the call site. Flag
        those.

chat:
  auto_reply: true
